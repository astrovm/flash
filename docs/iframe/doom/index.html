<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
        />
        <title>Doom</title>
        <link
            rel="stylesheet"
            href="../../vendor/js-dos/8.4.1/js-dos.css"
        />
        <style>
            html,
            body,
            #jsdos {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #000;
            }
        </style>
        <script src="../../vendor/js-dos/8.4.1/js-dos.js"></script>
    </head>
    <body>
        <div id="jsdos"></div>
        <script>
            "use strict";

            let pendingVolume = 1;
            let player = null;

            window.addEventListener("message", (event) => {
                if (
                    event.source !== window.parent
                    || event.origin !== window.location.origin
                ) return;
                if (event.data?.type !== "setVolume") return;

                const volume = Number(event.data.volume);
                pendingVolume = Number.isFinite(volume)
                    ? Math.min(Math.max(volume, 0), 1)
                    : 0;
                player?.setVolume(pendingVolume);
            });

            player = Dos(document.getElementById("jsdos"), {
                url: "../../dos/doom/doom.jsdos",
                pathPrefix: "../../vendor/js-dos/8.4.1/emulators/",
                backend: "dosbox",
                backendLocked: true,
                autoStart: true,
                countDownStart: 0,
                kiosk: true,
                mouseCapture: true,
                noCursor: true,
                renderAspect: "4/3",
                volume: pendingVolume
            });
            player.setNoCloud(true);

            window.addEventListener("pagehide", () => {
                player?.stop();
            }, { once: true });
        </script>
    </body>
</html>
