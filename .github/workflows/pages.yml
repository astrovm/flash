name: Test and deploy

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/LICENSE"
      - "**/LICENSE.*"
      - "**/LICENSE-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        if: github.event_name != 'push'
        run: bun run quality

      - name: Run tests
        if: github.event_name != 'push'
        run: bun run test

      - name: Enforce first-party coverage
        if: github.event_name != 'push'
        run: bun run test:coverage

      - name: Build production site
        run: bun run build --revision "${{ github.sha }}"

      - name: Confirm source tree was not modified
        if: github.event_name != 'push'
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- site)"
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi

      - name: Deploy site and catalog Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bun run deploy:worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke-test the production site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --output /dev/null 'https://xp.4st.li/'
          version="$(curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            'https://xp.4st.li/version.json')"
          VERSION="$version" bun -e \
            'const actual = JSON.parse(process.env.VERSION); const expected = await Bun.file("dist/version.json").json(); if (actual.version !== expected.version) throw new Error("Production is not serving the deployed version");'

      - name: Smoke-test production catalog route
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            'https://xp.4st.li/api/games?q=bike%20mania')"
          RESPONSE="$response" bun -e \
            'const payload = JSON.parse(process.env.RESPONSE); if (!Array.isArray(payload.games)) throw new Error("Invalid catalog response");'

      - name: Smoke-test the old domain redirect
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          location="$(curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --output /dev/null --write-out '%{redirect_url}' \
            'https://flash.4st.li/swf/?q=1')"
          test "$location" = 'https://xp.4st.li/swf/?q=1'

  required-ci:
    name: CI / Required
    # Always report a result, including when a prerequisite failed or was skipped.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every PR validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length > 0 and all(. == "success")' <<< "$RESULTS"
