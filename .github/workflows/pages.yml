name: Test and deploy GitHub Pages

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/LICENSE"
      - "**/LICENSE.*"
      - "**/LICENSE-*"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/LICENSE"
      - "**/LICENSE.*"
      - "**/LICENSE-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build production site
        run: bun run build --revision "${{ github.sha }}"

      - name: Confirm source tree was not modified
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- site)"
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - build
      - deploy-worker
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  deploy-worker:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy catalog Worker
        run: bun run deploy:worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke-test production catalog route
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            'https://flash.4st.li/api/games?q=bike%20mania')"
          RESPONSE="$response" bun -e \
            'const payload = JSON.parse(process.env.RESPONSE); if (!Array.isArray(payload.games)) throw new Error("Invalid catalog response");'
