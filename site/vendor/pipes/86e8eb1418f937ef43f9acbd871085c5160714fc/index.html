<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>3D Pipes</title>
    <style>
      html,
      body,
      #canvas-container {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      canvas {
        position: absolute;
        inset: 0;
      }

      #canvas-2d {
        pointer-events: none;
      }

      .pipes-controls {
        display: none;
      }
    </style>
    <script src="lib/three.min.js"></script>
    <script src="lib/OrbitControls.js"></script>
    <script src="lib/TeapotBufferGeometry.js"></script>
  </head>
  <body>
    <div class="pipes-controls" aria-hidden="true">
      <select id="joint-types" tabindex="-1">
        <option value="mixed" selected>Mixed</option>
      </select>
      <button id="fullscreen-button" type="button" tabindex="-1"></button>
      <button id="toggle-controls" type="button" tabindex="-1"></button>
    </div>
    <div id="canvas-container">
      <canvas id="canvas-webgl"></canvas>
      <canvas id="canvas-2d"></canvas>
    </div>
    <script src="screensaver.js"></script>
  </body>
</html>
