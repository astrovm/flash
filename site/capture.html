<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 480px;
        height: 360px;
        overflow: hidden;
        background: #000;
      }
      ruffle-player,
      iframe {
        width: 480px;
        height: 360px;
        display: block;
        border: 0;
      }
    </style>
    <script src="js/ruffle.js"></script>
    <script src="js/games.js"></script>
    <script src="js/flash-url-router.js"></script>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      const gameId = params.get("game");
      const game = window.FLASH_GAMES[gameId];

      if (!game) {
        throw new Error(`Unknown game: ${gameId}`);
      } else if (game.type === "iframe") {
        const ifr = document.createElement("iframe");
        ifr.src = `iframe/${gameId}/`;
        document.body.appendChild(ifr);
      } else {
        const router = window.AstroFlashUrlRouter.create(
          window.FLASH_GAMES,
          location.href,
        );
        window.fetch = router.wrapFetch(window.fetch);

        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        document.body.appendChild(player);

        const archiveUrl = game.archive?.launchUrl;
        player.load({
          url: archiveUrl || `swf/${gameId}/main.swf`,
          base: archiveUrl ? new URL(".", archiveUrl).href : `swf/${gameId}/`,
          letterbox: "on",
          scale: "showAll",
          forceScale: true,
          autoplay: "on",
          unmuteOverlay: "hidden",
          frameRate: game.frameRate,
          allowScriptAccess: false,
        });
      }
    </script>
  </body>
</html>
