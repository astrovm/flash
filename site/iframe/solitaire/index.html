<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Windows XP Solitaire</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #008000;
      }

      .emscripten {
        display: block;
        margin: 0;
      }

      canvas.emscripten {
        border: 0;
        padding: 0;
        transform: translateY(-32px);
      }

      #dropzone {
        width: 586px;
        height: 406px;
        overflow: hidden;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div id="spinner"></div>
      <div id="status">Downloading...</div>
      <progress id="progress"></progress>
    </div>
    <div class="hidden">
      <button id="startbtn" type="button" onclick="start()">Start</button>
      <button id="uploadbtn" type="button"></button>
      <input id="upload" type="file" multiple />
      <button id="downloadbtn" type="button"></button>
      <a id="modalLink"></a><a id="modalLinkExe"></a>
      <span id="sound-checkbox"
        ><input id="soundToggle" type="checkbox"
      /></span>
      <input id="pointerLock" type="checkbox" />
      <input id="showConsole" type="checkbox" />
      <input id="resize" type="checkbox" />
      <textarea id="output"></textarea>
      <input id="selectedItem" />
      <div id="tree"></div>
      <div id="loadStatus"></div>
      <a id="openModalExeClick"></a>
      <div id="message"></div>
      <div id="items"></div>
    </div>
    <div id="dropzone">
      <div>
        <canvas
          class="emscripten"
          id="canvas"
          oncontextmenu="event.preventDefault()"
        ></canvas>
      </div>
    </div>
    <script src="boxedwine-shell.js"></script>
    <script async src="boxedwine.js"></script>
  </body>
</html>
